<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Advanced Properties</title>    
</head>

<body>

    <h2>Flexbox Advanced Properties</h2>

    <div class="container">

        <div class="box box1">
            Box 1
        </div>

        <div class="box box2">
            Box 2
        </div>

        <div class="box box3">
            Box 3
        </div>

    </div>
    <style>
        body{
            width: 100%; height: 100vh;
            display: flex; flex-direction: column;
             justify-content: center; align-items: center;
             background-color: rgba(255, 94, 1, 0.384);
        }
        .container {
            display: flex;  width: 600px;   height: 200px;
            border: 2px solid rgb(14, 13, 13); gap: 10px;
        }

        .box {
            background-color: rgb(36, 36, 36);  color: white;
            padding: 20px;  text-align: center;
        }

        .box1 {
            flex-grow: 2;
        }

        .box2 {
            flex-shrink: 1;  flex-basis: 150px;
        }

        .box3 {
            flex: 1;   align-self: flex-end;
        }
    </style>

</body>
</html>
