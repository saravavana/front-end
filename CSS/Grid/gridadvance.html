<!DOCTYPE html>
<html>

<head>
    <title>CSS Grid Advanced</title>
</head>

<body>

    <h2>CSS Grid Advanced Properties</h2>

    <div class="container">
        <div class="box header">
            Header
        </div>
        <div class="box sidebar">
            Sidebar
        </div>
        <div class="box content">
            Content
        </div>
        <div class="box footer">
            Footer
        </div>
    </div>

    <h2>Auto Fit and Minmax</h2>

    <div class="cards">

        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
        <div class="card">Card 4</div>

    </div>

    <style>
        body{
            background-color: #ec0c0c;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            grid-template-areas:
                "header header header"
                "sidebar content content"
                "footer footer footer";
            width: 700px;
            margin: 50px auto;
        }

        .box {
            padding: 30px;
            background-color: rgb(248, 160, 77);
            color: rgb(3, 3, 3);
            text-align: center;
        }

        .header {
            grid-area: header;
        }

        .sidebar {
            grid-area: sidebar;
        }

        .content {
            grid-area: content;
        }

        .footer {
            grid-area: footer;
        }

        /* minmax example */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .card {
            background-color: #000000;
            color: white;
            padding: 25px;
            text-align: center;
        }
    </style>
</body>
</html>
