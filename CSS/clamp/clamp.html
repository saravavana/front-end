<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clamp Demo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(16px, 4vw, 40px);
      background: #111;
    }

    .card {
      width: min(90%, 700px);
       padding: clamp(20px, 5vw, 60px); 
      text-align: center;
      background: #222;
      border-radius: 20px;
    }

    h1 {
      font-size: clamp(32px, 7vw, 72px);
      margin-bottom: clamp(15px, 3vw, 30px);
    }

    p {
      font-size: clamp(14px, 2vw, 20px);
      line-height: 1.6;
      margin-bottom: clamp(20px, 4vw, 35px);
    }

    button {
  padding: clamp(10px, 2vw, 16px) clamp(18px, 4vw, 32px);

  font-size: clamp(14px, 1.5vw, 18px);

  border: none;
  border-radius: 10px;

  background: white;
  color: black;

  cursor: pointer;
}
  </style>
</head>

<body>

  <div class="card">
    <h1>Jane Mode 🕵️‍♂️</h1>

    <p>
      Resize the browser window and watch the heading,
      paragraph, padding and button change smoothly.
    </p>

    <button>Explore</button>
  </div>

</body>
</html>
