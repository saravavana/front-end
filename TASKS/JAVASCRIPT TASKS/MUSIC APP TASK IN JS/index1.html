<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <div id="music-player">

        <img id="song-image" src="/images/song1.jpg" />
        <div id="song-name">Song</div>
        <div id="song-artist">Artist</div>

        <input id="slider-song" type="range">
        <div class="time">
            <span id="current-time">0:00</span>
            <span id="total-time">0:00</span>
        </div>
        <div id="music-buttons">
            <i id="prev-song" class="fa-solid fa-backward-step "></i>
            <i id="playpause-song" class="fa-solid fa-play fa-1x"></i>
            <i id="next-song" class="fa-solid fa-forward-step "></i>
        </div>
    </div>
    <script src="script1.js"></script>
</body>

</html>
